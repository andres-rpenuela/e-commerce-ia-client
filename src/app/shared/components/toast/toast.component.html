
@if (toastService.toast(); as toast) {
  <div
    class="fixed top-5 right-5 z-50 w-full max-w-sm
           rounded-xl border p-4 shadow-xl
           backdrop-blur-sm"
    [class]="styles[toast.type]"
    role="alert"
    aria-live="assertive"
  >
    <div class="flex items-start gap-3">

      <!-- Icon -->
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-lg font-bold"
           [class]="iconStyles[toast.type]">
        @if (toast.type === 'success') {
          ✓
        } @else if (toast.type === 'error') {
          ✕
        } @else if (toast.type === 'warning') {
          ⚠
        } @else {
          ⓘ
        }
      </div>

      <!-- Content -->
      <div class="min-w-0 flex-1 space-y-1">

        <!-- Title -->
        <h3 class="text-sm font-bold">
          {{ TOAST_TYPE_KEYS[toast.type] | translate }}
        </h3>

        <!-- Message -->
        <p class="text-sm italic opacity-80 whitespace-pre-line">
          {{ toast.message | translate }}
        </p>

      </div>

      <!-- Close -->
      <button
        type="button"
        class="shrink-0 rounded-md p-1 text-lg opacity-50
               transition-opacity hover:opacity-100"
        (click)="toastService.dismiss()"
        aria-label="Cerrar notificación"
      >
        ×
      </button>

    </div>
  </div>
}
